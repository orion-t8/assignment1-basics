data:
  train_path: data/TinyStoriesV2-GPT4-train-tokenized.npy
  valid_path: data/TinyStoriesV2-GPT4-valid-tokenized.npy

tokenizer:
  vocab_path: trained_tokenizer/tinystories/vocab_20260921_204713.pkl
  merges_path: trained_tokenizer/tinystories/merges_20260921_204713.pkl

inference:
  temperature: 0.7
  top_p: 0.5
  max_tokens: 256

training:
  batch_size: 32
  max_tokens_processed: 327680000
  eval_interval: 500
  eval_iters: 20
  save_interval: 1000
  max_grad_norm: 1.0
  device: cuda
  seed: 42
  ckpt_path: checkpoint
  save_ckpt: False
  max_steps: 10000
  val_loss_threshold: 1.8

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  d_ff: 1344
  rope_theta: 10000
  num_layers: 4
  num_heads: 16

optimizer:
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99
  eps: 1e-8

lr_scheduler:
  max_learning_rate: 3e-3
  min_learning_rate: 3e-4
  warmup_iters: 1000
  cosine_cycle_iters: 40000

logging:
  wandb_project: tinystories-training